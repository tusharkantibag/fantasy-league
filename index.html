<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sports Fever IPL Fantasy 2026 — v5.4.5 (Auto Next + Auto-Hop)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>body{background:#f5f7fb}.player-list{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}.player-card{background:#fff;border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px;border:1px solid #e3e6ea}.avatar{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid #e0e0e0;background:#fafafa;flex:0 0 auto}.player-info{flex:1;display:flex;flex-direction:column}.player-name{font-weight:600;font-size:.98rem}.preview-card{background:#fff;border-radius:12px;border:1px solid #e3e6ea}</style>
</head>
<body>
  <main class="container" style="margin-top:1.25rem;">
    <div class="row">
      <div class="col s12 l5">
        <div class="card"><div class="card-content">
          <span class="card-title">Manage Transfers <span class="new badge blue" id="selCount" data-badge-caption="/11 selected">0</span></span>
          <div class="row" style="margin-bottom:.25rem;">
            <div class="input-field col s12 m6">
              <input id="email" type="email" class="validate" placeholder="you@example.com"><label class="active" for="email">Your Email</label>
            </div>
            <div class="col s12 m6" style="margin-top:.6rem;"><span id="nextMatchTitle">Finding next match…</span></div>
          </div>
          <select id="matchSelect" style="display:none"></select>
          <div class="budget" id="deadlinePanel" style="margin:-.25rem 0 .35rem 0; display:none;"><span id="deadlineText">—</span></div>
          <div id="playersList" class="player-list"></div>
        </div>
        <div class="sticky-actions">
          <a id="refreshPlayers" class="btn-flat waves-effect">Reload</a>
          <a id="submitBtn" class="btn blue disabled">Submit Transfers</a>
          <a id="buildFirstBtn" class="btn green darken-1 disabled">Build First XI</a>
        </div></div>
      </div>
      <div class="col s12 l7">
        <div class="card preview-card"><div class="card-content">
          <span class="card-title">My XI Preview</span>
          <div id="previewGrid"></div>
          <div id="validationMsg" class="helper"></div>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
  const API='https://script.google.com/macros/s/AKfycbztZ6_vU50CDSTtjfTyX6UNmc9epyrPlvFRUXIT3qKnNgwUqEClQevYbohNXc-IAyC9/exec';
  function notify(msg){ M && M.toast ? M.toast({html:msg,displayLength:2500}) : console.log(msg); }
  function safeUrl(u){ try{ if(!u) return ''; u=String(u).trim(); if(/^http:/.test(u)) u=u.replace(/^http:/,'https:'); return u; }catch(_){ return ''; } }
  function formatRole(r){ if(!r) return ''; r=String(r).trim().toUpperCase(); if(r==='WICKETKEEPER') return 'WK'; if(r==='BATSMAN'||r==='BATTER') return 'BAT'; if(r==='ALL-ROUNDER'||r==='ALLROUNDER'||r==='ALL_ROUNDER') return 'AR'; if(r==='BOWLER') return 'BOWL'; return r; }

  const emailEl=document.getElementById('email');
  const matchSelectEl=document.getElementById('matchSelect');
  const nextMatchTitle=document.getElementById('nextMatchTitle');
  const playersList=document.getElementById('playersList');
  const submitBtn=document.getElementById('submitBtn');
  const buildFirstBtn=document.getElementById('buildFirstBtn');
  const selCount=document.getElementById('selCount');
  const validationMsg=document.getElementById('validationMsg');

  let matches=[], matchMap=new Map(); let serverOffsetMs=0; let selectedNames=new Set(); let allPlayers=[]; let lastTeamPlayers=[]; let statsReady=false, playersReady=false; let userBudget=100, userUsed=0, totalBudget=100, maxFromTeam=7; let categoryCaps={maxForeign:4,minUncapped:1}; let constraints={WK:{min:1,max:2},BAT:{min:3,max:6},AR:{min:1,max:4},BOWL:{min:3,max:6}};
  function nowMs(){ return Date.now()+serverOffsetMs; }

  function isMatchLocked(){ const id=matchSelectEl.value||''; if(!id||!matchMap.has(id)) return false; const m=matchMap.get(id); if(!m||!m.deadlineEpoch) return false; return nowMs()>=Number(m.deadlineEpoch); }
  function selected(){ return Array.from(selectedNames); }

  function renderPlayers(){ playersList.innerHTML=''; allPlayers.forEach(p=>{ const card=document.createElement('div'); card.className='player-card'; const img=document.createElement(p.imageUrl?'img':'i'); if(p.imageUrl){ img.className='avatar'; img.referrerPolicy='no-referrer'; img.loading='lazy'; img.decoding='async'; img.src=safeUrl(p.imageUrl); img.onerror=function(){ const ico=document.createElement('i'); ico.className='material-icons grey-text'; ico.textContent='person'; this.replaceWith(ico); }; } else { img.className='material-icons grey-text'; img.textContent='person'; } const info=document.createElement('div'); info.className='player-info'; info.innerHTML=`<span class='player-name'>${(p.name||'(Unnamed)')}</span>`; const label=document.createElement('label'); label.innerHTML='<input type="checkbox"/><span></span>'; const cb=label.querySelector('input'); cb.value=p.name; cb.checked=selectedNames.has(p.name); card.appendChild(label); card.appendChild(img); card.appendChild(info); playersList.appendChild(card); }); playersReady=true; updateSelectionUI(); }

  playersList.addEventListener('change', (e)=>{ const cb=e.target && e.target.matches && e.target.matches('input[type=checkbox]')? e.target : (e.target.closest? e.target.closest('input[type=checkbox]'):null); if(!cb) return; if(cb.checked) selectedNames.add(cb.value); else selectedNames.delete(cb.value); updateSelectionUI(); });

  function updateSelectionUI(){ const n=selected().length; selCount.textContent=n; const locked=isMatchLocked(); const hasBase=!!(lastTeamPlayers&&lastTeamPlayers.length); const isFirstMatch=(function(){ if(!matches||!matches.length) return false; const minId=String(matches.reduce((m,x)=>Math.min(m,Number(x.id)),Number(matches[0].id))); return String(matchSelectEl.value)===minId; })();
    submitBtn.style.display = hasBase ? 'inline-flex' : 'none';
    buildFirstBtn.style.display = (!hasBase && isFirstMatch) ? 'inline-flex' : 'none';
    if(locked){ submitBtn.classList.add('disabled'); buildFirstBtn.classList.add('disabled'); return; }
    if(!emailEl.value || n!==11){ submitBtn.classList.add('disabled'); buildFirstBtn.classList.add('disabled'); return; }
    if(hasBase){ submitBtn.classList.remove('disabled'); buildFirstBtn.classList.add('disabled'); }
    else if(isFirstMatch){ buildFirstBtn.classList.remove('disabled'); }
  }

  async function fetchMatches(){ try{ const res=await fetch(`${API}?action=matches`); const j=await res.json(); matches=j.matches||[]; matchMap=new Map(matches.map(m=>[String(m.id),m])); if(typeof j.serverNow==='number') serverOffsetMs=Number(j.serverNow)-Date.now(); const minFuture=(function(){ const future=matches.filter(m=> m.deadlineEpoch && Number(m.deadlineEpoch)>nowMs()); future.sort((a,b)=>Number(a.deadlineEpoch)-Number(b.deadlineEpoch)); return future.length? future[0].id: (matches[0]? matches[0].id:''); })(); matchSelectEl.value=String(minFuture); const m=matchMap.get(String(matchSelectEl.value)); nextMatchTitle.textContent=m? (m.label||`Match ${m.id}`):'—'; }catch(e){ notify('matches failed'); }
  }

  async function fetchAllPlayers(){ try{ const res=await fetch(`${API}?action=allplayers`); const j=await res.json(); allPlayers=Array.isArray(j.players)? j.players: []; renderPlayers(); }catch(e){ notify('players failed'); }
  }

  async function fetchUserStats(){ const email=(emailEl.value||'').trim().toLowerCase(); if(!email) return; try{ const res=await fetch(`${API}?action=userstats&email=${encodeURIComponent(email)}`); const j=await res.json(); userBudget=Number(j.budget||100); userUsed=Number(j.used||0); lastTeamPlayers=Array.isArray(j.lastTeam)? j.lastTeam: []; totalBudget=Number(j.totalBudget||100); maxFromTeam=Number(j.maxFromTeam||7); categoryCaps=j.categoryCaps||categoryCaps; constraints=j.constraints||constraints; selectedNames=new Set(lastTeamPlayers||[]); statsReady=true; updateSelectionUI(); }catch(e){ notify('stats failed'); }
  }

  document.addEventListener('DOMContentLoaded', async ()=>{ const stored=(function(){ try{return localStorage.getItem('ml_email')||'';}catch(_){return'';} })(); if(stored) emailEl.value=stored; await fetchMatches(); await fetchAllPlayers(); await fetchUserStats(); document.addEventListener('input',(e)=>{ if(e.target.id==='email'){ try{localStorage.setItem('ml_email', e.target.value||'');}catch(_){ } fetchUserStats(); }});
  });
  </script>
</body>
</html>
